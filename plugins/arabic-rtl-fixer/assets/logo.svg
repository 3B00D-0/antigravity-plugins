<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rtlGrad" x1="104" y1="36" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="ltrGrad" x1="24" y1="92" x2="104" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Tile -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5"/>

  <!-- Top RTL Flow Arrow (Right to Left) -->
  <path d="M98 40H34M34 40L46 28M34 40L46 52" stroke="url(#rtlGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arabic Letter Dhad / Ain stylized glyph accent on right -->
  <text x="86" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-weight="700" font-size="18" fill="#10B981" text-anchor="middle">ع</text>

  <!-- Center Divider / Paragraph Alignment Lines -->
  <line x1="48" y1="64" x2="98" y2="64" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="36" cy="64" r="3" fill="#94A3B8"/>

  <!-- Bottom LTR Flow Arrow (Left to Right) -->
  <path d="M30 88H94M94 88L82 76M94 88L82 100" stroke="url(#ltrGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="42" y="107" font-family="Segoe UI, Inter, sans-serif" font-weight="700" font-size="14" fill="#60A5FA" text-anchor="middle">EN</text>
</svg>
